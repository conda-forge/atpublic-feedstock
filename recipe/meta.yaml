{% set name = "atpublic" %}
{% set version = "9.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 61ea62d8445d2aaa83b6dffaa3d90f99fcec10e16683ee9b13792cdcdafa0966


build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    # - atpublic-install >=1.0.0

test:
  imports:
    - public
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://public.readthedocs.io/
  dev_url: https://gitlab.com/warsaw/public.git
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Keep all y'all's __all__'s in sync
  doc_url: https://public.readthedocs.io

extra:
  recipe-maintainers:
    - keller00
    - johanneskoester
